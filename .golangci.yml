version: "2"

linters:
  default: all
  disable:
    # deprecated
    - exhaustruct
    - gomodguard
    - wsl
    # unwanted
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct_v5
    - forcetypeassert
    - funcorder
    - funlen
    - goconst
    - gomodguard_v2
    - gosec
    - inamedparam
    - ireturn
    - maintidx
    - mnd
    - musttag
    - nestif
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - recvcheck
    - varnamelen
    - wsl_v5
  settings:
    gocognit:
      min-complexity: 180
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${base-path}/internal/ruleguard/*.go
    gocyclo:
      min-complexity: 100
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      enable-default-rules: true
      rules:
        # defaults
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
        # additionals
        - name: confusing-naming
        - name: enforce-switch-style
          arguments: [ "allowNoDefault" ]
        - name: import-alias-naming
        - name: import-shadowing
        - name: unhandled-error
        - name: use-slices-sort
    staticcheck:
      checks:
        - "all"
        - "-QF1002"
        - "-QF1008"
        - "-QF1011"
    tagalign:
      order:
        - tfsdk
        - tfdata
    tagliatelle:
      case:
        rules:
          json: snake
          tfsdk: snake
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - wrapcheck
        text: github.com/jeremmfr/terraform-provider-junos/internal
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - localModule
        - default
      custom-order: true
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
